name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    name: Validate dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.17
      - run: uv lock --check

  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    needs: lock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Ruff check
        id: ruff_check
        run: uv run ruff check .
        continue-on-error: true

      - name: Format check
        id: ruff_format
        run: uv run ruff format --check .
        continue-on-error: true

      - name: Type check
        id: mypy
        run: uv run mypy adaptive
        continue-on-error: true

      - name: Quality gate
        if: always()
        run: |
          if [ "${{ steps.ruff_check.outcome }}" != "success" ] || [ "${{ steps.ruff_format.outcome }}" != "success" ] || [ "${{ steps.mypy.outcome }}" != "success" ]; then
            echo "One or more quality checks failed"
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pytest tests -q --ignore=tests/integration

  database-integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    needs: lock
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: adaptive_rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adaptive_rag"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups
      - run: if [ -d tests/db ]; then uv run pytest tests/db -q; else echo 'No database integration tests yet'; fi

  smoke:
    name: Compose and smoke tests
    runs-on: ubuntu-latest
    needs: [quality, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups
      - run: docker compose config
      - run: uv run pytest tests/smoke -q

  image:
    name: Build application image
    runs-on: ubuntu-latest
    needs: [quality, unit, smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: adaptive-rag:ci
