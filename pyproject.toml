[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Adaptive Agentic RAG V1 - Standalone Dockerized System"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.112.0,<0.113.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "pgvector>=0.2.5,<1.0.0",
    "redis>=5.0.0,<6.0.0",
    "rank-bm25>=0.2.0,<0.3.0",
    "openai>=1.0.0,<2.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "opentelemetry-api>=1.26.0,<2.0.0",
    "opentelemetry-sdk>=1.26.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.26.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.46.0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46.0,<1.0.0",
    "sqlglot>=25.0.0,<26.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-magic>=0.4.27,<1.0.0",
    "markitdown>=0.0.1,<1.0.0",
    "pypdf>=4.0.0,<5.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "structlog>=24.1.0,<25.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "psycopg[binary]>=3.3.4",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.3.9,<0.5.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "faker>=30.0.0,<31.0.0",
]
phoenix-eval = [
    "arize-phoenix-client==1.27.0",
    "arize-phoenix-evals==2.7.1",
]

[project.scripts]
adaptive-phoenix-eval = "adaptive.observability.phoenix_eval_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.5.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "faker>=30.0.0,<31.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "UP", "W", "C4", "C9", "T20", "TID", "ARG", "PTH", "ERA", "PL", "TRY", "SIM", "NPY", "PERF", "RET", "ICN", "PIE", "TD", "LOG", "PTH", "TCH", "ANN", "AIR", "B", "C", "DTZ", "EXE", "ISC", "PT", "Q", "RSE", "S", "SLF", "T10", "TID", "TRY", "FLY"
]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "S101", "PLW2901", "T201", "T203"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "ARG001", "ARG002"]
"adaptive/config.py" = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
[mypy-overrides]
module = ["sqlalchemy*", "alembic*", "opensearch*", "langgraph*", "langchain*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adaptive"]
